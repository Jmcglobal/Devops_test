  set-image-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set Image Tag
        id: set-tag
        run: |
          IMAGE_TAG="$(date +%Y-%m-%d-%H-%M)-${GITHUB_SHA::6}"
          echo "Generated IMAGE_TAG=$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

